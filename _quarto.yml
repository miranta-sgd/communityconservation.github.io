project:
  type: website
  output-dir: docs

lightbox:
  match: auto
  effect: fade
  desc-position: right
  loop: true

logo:
  medium:
    light: images/logo-full-300ppi.png
    dark: images/logo-white-300ppi.png


website:
  #site-url: add domain once we have it
  #repo-url: I assume we will need to host it on github or similar
  image: 'images/logo-full-300ppi.png'
  favicon: 'images/logo-icon-300ppi.png'
  open-graph: true #internet protocol that uses special meta tags in a webpage's HTML to control how a link looks when shared on social media and messaging apps
  
  twitter-card: true #a snippet of rich preview information that automatically appears when a website URL is shared in a post on X

  
  navbar:
    search: false
    pinned: true
    collapse: true
    logo: 'images/logo-full-300ppi.png'
    logo-alt: "Community Conservation Award logo"
    
    
    left:
      - href: about.qmd
        text: About Us
      - href: fundedprojects.qmd
        text: Previously Funded Projects
      - href: enquiries.qmd
        text: Enquiries
    tools: []
  
  page-footer: 
    background: "#f1f1f1"
    
    left: |
      2026 All rights reserved.
    center: |
      Website created by Science Graphic Design in Quarto. 
      
    right:
      - icon: bluesky
        href: https://bsky.app/profile/name
      - icon: instagram
        href: https://www.instagram.com/profilename
    
format:
  html:
    theme:
      light: cosmo
      dark: darkly
    title-block: false
    css: styles.css
    toc: true

editor: visual